<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly - Interactive Dictionary SPA</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-book-open-reader"></i>
                <h1>Wordly</h1>
            </div>
            <p class="tagline">Your dynamic online language learning companion</p>
        </header>

        <!-- Search Section -->
        <main>
            <section class="search-section">
                <form id="search-form" class="search-form">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input 
                            type="text" 
                            id="search-input" 
                            placeholder="Search for any word..." 
                            aria-label="Search for a word"
                            autocomplete="off"
                            required
                        >
                        <button type="button" id="clear-btn" class="clear-btn hidden" aria-label="Clear input">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <button type="submit" class="submit-btn">
                        <span>Search</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </section>

            <!-- Results Section -->
            <section id="results-section" class="results-section hidden" aria-live="polite">
                <!-- Dynamic Content Will Be Injected Here -->
            </section>

            <!-- Loading Spinner State -->
            <div id="loading-spinner" class="loading-spinner hidden">
                <div class="spinner"></div>
                <p>Searching dictionary...</p>
            </div>

            <!-- Error State -->
            <div id="error-container" class="error-container hidden">
                <div class="error-content">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <h3 id="error-title">Word Not Found</h3>
                    <p id="error-message">We couldn't find definitions for the word you were looking for. Please try checking your spelling.</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>&copy; 2026 Wordly Platform. Powered by Free Dictionary API.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
